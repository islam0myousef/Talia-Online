<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Talia Online</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login">
  <div class="panel">
    <h1>⚔️ Talia Online</h1>
    <p>High-Rate Browser MMO</p>

    <input id="name" placeholder="Character name" maxlength="16" value="AbuTalia">
    <input id="password" type="password" placeholder="Password">

    <button id="play">PLAY</button>

    <small>GM test account: AbuTalia / CHANGE_ME</small>
  </div>
</div>

<div id="game" class="hidden">

  <div id="hud">
    <b id="heroName">Player</b>
    <span>Lv <b id="level">1</b></span>
    <span>💰 <b id="gold">0</b></span>
    <span>🟣 <b id="cps">0</b></span>
    <button id="gmBtn" class="hidden">👑 GM</button>
  </div>

  <canvas id="world"></canvas>

  <div id="drops"></div>

  <div id="controls">
    <button data-dir="up">▲</button>

    <div>
      <button data-dir="left">◀</button>
      <button data-dir="down">▼</button>
      <button data-dir="right">▶</button>
    </div>
  </div>

</div>

<div id="gmPanel" class="modal hidden">

  <div class="panel gm">

    <h2>👑 GM Panel</h2>

    <label>
      Gold Min
      <input id="goldMin" type="number">
    </label>

    <label>
      Gold Max
      <input id="goldMax" type="number">
    </label>

    <label>
      CP Min
      <input id="cpsMin" type="number">
    </label>

    <label>
      CP Max
      <input id="cpsMax" type="number">
    </label>

    <label>
      Meteor Rate
      <input id="meteorRate" type="number" step="0.01">
    </label>

    <label>
      DragonBall Rate
      <input id="dragonBallRate" type="number" step="0.01">
    </label>

    <label>
      Rare Item Rate
      <input id="rareItemRate" type="number" step="0.01">
    </label>

    <button id="saveConfig">
      SAVE DROP SETTINGS
    </button>

    <button id="closeGM">
      CLOSE
    </button>

  </div>

</div>

<script src="game.js"></script>

</body>
</html>
