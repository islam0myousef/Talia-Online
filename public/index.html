<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Talia Online V2</title><link rel="stylesheet" href="style.css"></head><body>
<div id="login" class="screen"><div class="loginbox"><div class="logo">TALIA <span>ONLINE</span></div><p>Classic 2D MMORPG</p><input id="name" maxlength="18" value="AbuTalia" placeholder="Character name"><select id="class"><option value="warrior">Warrior</option><option value="trojan">Trojan</option><option value="archer">Archer</option><option value="taoist">Taoist</option></select><button id="play">ENTER WORLD</button><small>Original game project inspired by classic MMORPG design.</small></div></div>
<div id="game" class="hidden"><canvas id="world"></canvas><div class="topbar"><div class="avatar"><b id="pname">AbuTalia</b><span id="pclass">Warrior</span></div><div class="bars"><div class="hp"><i id="hpbar"></i></div><div class="xp"><i id="xpbar"></i></div></div><div class="stats"><span>Lv <b id="level">1</b></span><span>🪙 <b id="gold">0</b></span><span>💎 <b id="cp">0</b></span></div><button id="gm" class="gm hidden">♛ GM</button></div>
<div id="target" class="target hidden"><b id="targetName">Azure Bandit</b><div><i></i></div></div>
<div class="side"><button data-panel="inventory">🎒</button><button data-panel="character">👤</button><button data-panel="skills">✨</button><button data-panel="quests">📜</button><button data-panel="map">🗺️</button></div>
<div id="panel" class="panel hidden"></div><div id="chat" class="chat"></div><div class="chatbar"><input id="chatInput" placeholder="Chat..."><button id="sendChat">➤</button></div>
<div class="controls"><button data-dir="up">▲</button><div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div></div>
<div class="actionbar"><button id="attack">⚔️<small>Attack</small></button><button id="skill">🔥<small>Skill</small></button><button id="pickup">✋<small>Pick up</small></button><button id="jump">⤴<small>Jump</small></button></div>
<div id="toast"></div><div id="gmPanel" class="modal hidden"><div><h2>♛ GM PANEL</h2><button data-gm="reward">Max Rewards</button><button data-gm="spawn">Spawn Boss Event</button><input id="announce" placeholder="Announcement"><button id="announceBtn">Broadcast</button><button id="closeGM">Close</button></div></div>
</div><script src="game.js"></script></body></html>
